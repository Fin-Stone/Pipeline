# Automated review on the way into `dev`.
#
# PR-Agent is Apache-2.0 and runs as an ordinary action; public-repository
# minutes are unlimited, and the model is Gemini's free tier through Google AI
# Studio. So this costs nothing to run and needs no server.
#
# Advisory on purpose — it is not in the required checks. A free-tier rate
# limit or a provider outage would otherwise block every merge, and a review
# bot that can stop the world is a review bot that gets removed.
#
# The diff it sends to the model is already public by the time this runs: the
# staging gate in the private repository is what decides whether anything is
# published at all. That ordering is deliberate, and it is why this workflow
# lives on the public side and nowhere else.

name: pr-agent

on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, ready_for_review]
  # /review, /describe, /improve and /ask arrive as issue comments. Without
  # this trigger the interactive half of the tool silently does nothing.
  issue_comment:
    types: [created]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # The Bot check stops it answering its own comments in a loop. The variable
    # is a kill switch rather than an opt-in: unset means enabled.
    #
    # The last clause is because `issue_comment` fires on issues as well as on
    # pull requests, and there is nothing for this to review on an issue.
    # `github.event.issue.pull_request` is present only when the comment is on
    # a pull request, which is the documented way to tell the two apart.
    if: >-
      github.event.sender.type != 'Bot' &&
      vars.ENABLE_PR_AGENT != 'false' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ${{ vars.PR_AGENT_RUNNER || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
      issues: write
      # Read, not write. Upstream asks for write so /improve can commit its
      # suggestions back to the branch; an agent that can push to the branch it
      # is reviewing is a bigger change than a review bot, and not one being
      # made here.
      contents: read
    steps:
      # The action swallows a failed model call and exits 0. So a missing key
      # is indistinguishable from a successful review: a green check, and one
      # comment reading "Failed to generate code suggestions for PR". That is
      # what pull requests #1, #3 and #4 each got — three green ticks, no
      # review, and nothing anywhere saying the key had never been added.
      #
      # A check that cannot fail reads as coverage. This one can now fail, and
      # it fails here rather than in the middle of a review nobody receives.
      #
      # The secrets context is not available to `if:`, which is why this is a
      # step body rather than a condition — the same shape publish.yml uses to
      # check PUBLISH_KEY.
      - name: The model key has to exist
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -eu
          if [ -z "${KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY is not set on this repository, so the"
            echo "::error::review below would post 'Failed to generate code"
            echo "::error::suggestions for PR' and still report success."
            echo "::error::"
            echo "::error::Add it under Settings -> Secrets and variables -> Actions"
            echo "::error::(a Google AI Studio key, free tier), or set the repository"
            echo "::error::variable ENABLE_PR_AGENT to 'false' to switch this off."
            exit 1
          fi

      # Pinned to the commit behind v0.42.0 — not @main, and not the tag
      # either, because a tag can be repointed by whoever owns that repository
      # and this step runs on every pull request holding `pull-requests: write`
      # and `issues: write`. The note that used to sit here said "TODO before
      # enabling"; it was enabled, and had already run three times.
      #
      # Bumping it is a deliberate commit: read the release notes, change both
      # the sha and the comment.
      - uses: the-pr-agent/pr-agent@f6af7d77554ff8d26adffded077e6461329e92fa # v0.42.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "gemini/gemini-2.5-flash"
          config.fallback_models: '["gemini/gemini-2.0-flash"]'
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
