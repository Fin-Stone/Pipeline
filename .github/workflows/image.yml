# Build and publish the image, so installing does not mean building.
#
# A self-hoster should not need a toolchain, a repository, or ten minutes of
# their mini-PC's fan to try something. They should need `docker run`. That is
# what this workflow is for.
#
# Published to GHCR, which needs no account setup beyond the repository itself
# and no secret beyond the token Actions already has.

name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/finstone

jobs:
  build:
    if: github.repository == 'Fin-Stone/Pipeline'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Not on a pull request: a fork must not be able to publish. The build
      # still runs, so a change that breaks the image is caught before merge —
      # which is the half of this that matters for review.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Built once for this architecture and loaded locally, so the next step
      # can look inside it before anything is pushed.
      - name: Build for inspection
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile
          platforms: linux/amd64
          load: true
          tags: finstone:inspect
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # .dockerignore already excludes uploads/, data/, category/ and the
      # proposal/residual dumps, with a comment naming this exact threat. But
      # nothing verifies it, and a later negation or a restructure that moves
      # real data outside those prefixes would start baking statements into a
      # published layer — first noticed as a public image, which is the one
      # place it cannot be taken back from.
      #
      # So this asserts against the built image rather than trusting the file.
      - name: No real data in the image
        run: |
          set -eu
          contents=$(docker run --rm --entrypoint sh finstone:inspect -c \
            'find / -xdev \( -path /proc -o -path /sys \) -prune -o -print 2>/dev/null')
          status=0
          for forbidden in /uploads /data /category; do
            if printf '%s\n' "$contents" | grep -qE "^${forbidden}/.+"; then
              echo "::error::${forbidden} is present in the image. Check .dockerignore."
              printf '%s\n' "$contents" | grep -E "^${forbidden}/.+" | head -n 20
              status=1
            fi
          done
          if printf '%s\n' "$contents" | grep -qE '/(proposal|residual)[^/]*\.json$'; then
            echo "::error::a proposal/residual dump is in the image. Check .dockerignore."
            status=1
          fi
          exit "$status"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile
          # arm64 as well as amd64. The target box here is an N95, but a Pi 5
          # or an ARM VPS is the same install, and a self-hoster finding out
          # their architecture is unsupported at `docker run` is a bad first
          # minute.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
