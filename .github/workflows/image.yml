# Build and publish the image, so installing does not mean building.
#
# A self-hoster should not need a toolchain, a repository, or ten minutes of
# their mini-PC's fan to try something. They should need `docker run`. That is
# what this workflow is for.
#
# Published to GHCR, which needs no account setup beyond the repository itself
# and no secret beyond the token Actions already has.

name: image

# A tag push is not a trigger here, and the semver rules further down are not
# orphaned by that. release.yml creates the tag with GITHUB_TOKEN, and GitHub
# does not start workflow runs from events raised by that token — so
# `tags: ["v*"]` sat here reading as coverage while being unable to fire. It
# took v0.1.0 to show it: tag pushed, release published, no 0.1.0 image behind
# either of them, and nothing anywhere to say so.
#
# workflow_dispatch is the documented exception — those events always create a
# run, GITHUB_TOKEN or not — and it takes a ref. So release.yml dispatches this
# workflow on the tag it has just pushed, github.ref is that tag, and
# type=semver resolves against it exactly as it was always meant to.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One build per commit at a time, queued rather than cancelled.
#
# A release makes two runs on the same commit: the push to `main`, and the
# dispatch on the tag that was just cut from it. They used to start about
# twelve seconds apart, because release.yml finishes in seven seconds and this
# build takes four minutes — so both ran cold, in parallel, and the claim that
# the second reused the first's cache was simply false.
#
# Serialising them makes it true. cancel-in-progress is false because the
# second run is the one that publishes the version tags; cancelling it would
# leave a release with no 0.x.y image behind it, which is the exact failure
# this dispatch path was added to fix.
concurrency:
  group: image-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/finstone

jobs:
  build:
    if: github.repository == 'Fin-Stone/Pipeline'
    runs-on: ubuntu-latest
    # A build here takes four to five minutes. The default job timeout is six
    # hours, and on the push of 6fd4094 this step sat on `Build and push` for
    # sixty-two minutes before a human cancelled it. Without a bound, a hung
    # build costs a runner most of a day and — worse — nobody learns the image
    # failed to publish until they go looking.
    #
    # Thirty minutes is six times the normal run: generous enough that a slow
    # arm64 build under emulation still finishes, tight enough to be news.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Not on a pull request: a fork must not be able to publish. The build
      # still runs, so a change that breaks the image is caught before merge —
      # which is the half of this that matters for review.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # Two triggers, two jobs. A push to main moves `latest` and records
          # `sha-<short>`; the dispatch on `refs/tags/vX.Y.Z` is what makes
          # type=semver resolve, so that is where 0.1.0 and 0.1 come from.
          # is_default_branch is false on a tag ref, which is why `latest` is
          # the push's to move and not the tag's.
          #
          # It is worth knowing exactly how literal that rule is: the action
          # compares this ref against the repository's *configured* default
          # branch, so pointing the default at something other than `main`
          # stops `latest` moving without failing anything. That is not
          # hypothetical either — while the default was briefly `dev`, the
          # push of 3fde335 published `sha-3fde335` and left `latest` on a
          # build from before the history rewrite. Nothing went red; `docker
          # pull` just kept serving a three-day-old image.
          #
          # A release therefore builds twice, from the same commit — once for
          # `latest`, once for the version. The concurrency group above makes
          # the second run wait for the first, so it inherits the layers rather
          # than rebuilding them, and paying a manifest push is the price of
          # the version tags naming the commit that was actually released.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Built once for this architecture and loaded locally, so the next step
      # can look inside it before anything is pushed.
      - name: Build for inspection
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile
          platforms: linux/amd64
          load: true
          tags: finstone:inspect
          # Its own cache scope, and this is not tidiness.
          #
          # `type=gha` defaults to one scope per ref, so both build steps in
          # this job were reading and writing the same entry: an amd64-only
          # export, then a two-architecture one, each overwriting the other
          # every run. The arm64 layers were evicted by the step that never
          # builds them, so the step that does started from nothing more often
          # than the cache configuration suggested it would.
          cache-from: type=gha,scope=inspect
          cache-to: type=gha,mode=max,scope=inspect

      # Asserts against the built image rather than trusting .dockerignore.
      # The rules live in infra/scripts/check-image-data.sh, which reads the
      # listing on stdin, so they can be tested without a Docker daemon.
      #
      # As root, not as the image's own uid 10001: `find /` run unprivileged
      # cannot read every directory in the image, so it exits non-zero for that
      # reason alone. With stderr discarded and `set -e` in force, that killed
      # the step before a single assertion ran — a silent failure with no
      # output to explain it.
      #
      # stderr is kept, and pipefail is set, because the only thing worse than
      # this step failing for an unrelated reason is it passing for one.
      - name: No real data in the image
        run: |
          set -euo pipefail
          docker run --rm --user 0 --entrypoint sh finstone:inspect -c \
            'find / -xdev \( -path /proc -o -path /sys \) -prune -o -print' \
            | sh infra/scripts/check-image-data.sh

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile
          # arm64 as well as amd64. The target box here is an N95, but a Pi 5
          # or an ARM VPS is the same install, and a self-hoster finding out
          # their architecture is unsupported at `docker run` is a bad first
          # minute.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # See the inspection build above: separate scope, so the multi-arch
          # layers are not overwritten by the single-arch step next door.
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
