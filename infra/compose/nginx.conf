server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A single-page app: every path that is not a real file is the app itself,
    # or a refresh on any screen but the first returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so they can be cached hard. index.html must not be, or
    # an upgraded container keeps serving the previous build to a returning
    # browser — which is how a self-hoster ends up running two versions at once.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
