# The stack: one service, and a container to run the CLI in.
#
# `docker compose up` must work with no setup at all — Rule 3 counts every
# manual step as a tax on every future install — so the default database is
# SQLite in the data volume. Postgres is an overlay, not a prerequisite:
#
#     docker compose up                                          # SQLite
#     docker compose -f docker-compose.yml \
#                    -f infra/compose/postgres.yml up             # Postgres
#
# The app image carries the client, so there is no second web container and no
# CORS in the default path: the browser talks to one origin because there only
# is one. See infra/compose/Dockerfile.

name: finstone

x-app: &app
  build:
    context: ../..
    dockerfile: infra/compose/Dockerfile
  image: ${FINSTONE_IMAGE:-ghcr.io/fin-stone/finstone:latest}
  environment:
    # SQLite unless something overrides it. The postgres overlay does.
    DATABASE_URL: ${DATABASE_URL:-sqlite:////srv/finstone/data/finstone.db}
    FINSTONE_DATA_DIR: /srv/finstone/data
    FINSTONE_UPLOADS_DIR: /srv/finstone/uploads
    # Same origin by construction now, so there is nothing to allow. Kept
    # settable for the case where somebody serves the client from elsewhere.
    FINSTONE_CORS_ORIGINS: ${FINSTONE_CORS_ORIGINS:-*}
    # Deliberately absent: FINSTONE_ALLOW_PROD. Processing real data must be an
    # explicit act. See the development rules in README.md, Rule 2.
  volumes:
    - ../../data:/srv/finstone/data
    # Read-only: the pipeline copies out of uploads and must never write to the
    # operator's own folder.
    - ../../uploads:/srv/finstone/uploads:ro

services:
  app:
    <<: *app
    restart: unless-stopped
    ports:
      # `FINSTONE_BIND` is empty by default, so a laptop gets 0.0.0.0 and the
      # phone on the sofa can reach it. A server install sets it to
      # `127.0.0.1:` so the reverse proxy is the only way in — which matters
      # more here than usual, because there is no authentication to fall back
      # on if something else finds the port.
      - "${FINSTONE_BIND:-}${FINSTONE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Where `docker compose run --rm cli finstone ...` runs. Separate from the
  # app so a long ingest cannot take the dashboard down with it.
  cli:
    <<: *app
    profiles: ["cli"]
    command: ["sleep", "infinity"]

# Postgres is not here. It lives in postgres.yml as an explicit overlay,
# because Compose interpolates every service whether or not its profile is
# selected — so a required POSTGRES_PASSWORD in this file makes the plain
# `docker compose up` fail before it starts, which is the one thing this stack
# must not do.
