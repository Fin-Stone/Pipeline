# Finstone behind nginx.
#
# Installed to /etc/nginx/sites-available/finstone by infra/scripts/install.sh,
# which substitutes SERVER_NAME and APP_PORT. Copy it by hand if you would
# rather; nothing in it is generated at runtime.
#
# **One location, because there is one origin.** The container serves the app
# at `/` and the API at `/api/v1/`, so this is a plain reverse proxy with
# nothing to route and no CORS to get right. The client still asks which server
# to talk to (architecture §5.2) — it just answers itself, from the address the
# page came from.
#
# The container binds to 127.0.0.1 when FINSTONE_BIND is set, so this proxy is
# the only route in. That is load-bearing rather than tidy: there is no
# authentication yet, and an exposed port is the whole ledger.
#
# You do not need this file to run Finstone. It is for a name, port 80, and TLS
# later; the container is perfectly happy serving :8000 directly.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # Statements are large and the client uploads nothing today, but a reparse
    # posted through here would hit the 1 MB default and fail as a 413 with no
    # useful message.
    client_max_body_size 64m;

    # The ledger is nobody's business but the household's, and a household
    # dashboard has no reason to be framed, sniffed or sent as a referrer.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:APP_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An ingest of a year of statements is not a fast request, and the
        # 60-second default turns a working import into a 504 halfway through.
        proxy_read_timeout 300s;

        # Caching is decided by the application — hashed assets immutable,
        # index.html no-store — so this hop adds no policy of its own rather
        # than having two places that can disagree about which build a
        # returning browser gets.
    }
}

# --- TLS -------------------------------------------------------------------
#
# Deliberately not enabled by default, because it cannot be done honestly from
# a script. What is right depends on the name:
#
#   A real domain pointed at this box
#       sudo certbot --nginx -d finstone.example.com
#       Certbot rewrites the block above and adds the redirect.
#
#   A .lan / .local / .home name, which is the normal case on-prem
#       Let's Encrypt cannot issue for a name it cannot resolve. Either use
#       DNS-01 against a domain you own, or issue your own CA with `mkcert`
#       and trust it on the handful of devices that will ever open this.
#
# Until then this is plain HTTP on your own network. With no authentication in
# front of it, treat "on the LAN" as the whole of the access control — because
# it is.
