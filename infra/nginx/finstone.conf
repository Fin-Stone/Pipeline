# Finstone behind nginx, on one origin.
#
# Installed to /etc/nginx/sites-available/finstone by infra/scripts/install.sh,
# which substitutes SERVER_NAME and the two ports. Copy it by hand if you would
# rather; nothing in it is generated at runtime.
#
# **One origin on purpose.** The UI is served at `/` and the API at `/api/`, so
# a browser talks to a single host and CORS never enters the picture. The
# alternative — two ports on the LAN — means the client has to be told about
# both, and every self-hoster has to get a CORS list right before anything
# loads. The client still asks which server to talk to (architecture §5.2);
# behind this file the answer is simply this host, with no port.
#
# The stack binds to 127.0.0.1 when FINSTONE_BIND is set, so this proxy is the
# only route in. That is load-bearing rather than tidy: there is no
# authentication yet, and an exposed port is the whole ledger.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # Statements are large and the client uploads nothing today, but a reparse
    # posted through here would hit the 1 MB default and fail as a 413 with no
    # useful message.
    client_max_body_size 64m;

    # The ledger is nobody's business but the household's, and a household
    # dashboard has no reason to be framed, sniffed or sent as a referrer.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # The API first: a prefix match would otherwise be shadowed by `/`.
    #
    # No trailing slash on proxy_pass, so the full path arrives intact. With
    # one, nginx would strip `/api/` and the versioned prefix the whole
    # contract is built on would never reach the application.
    location /api/ {
        proxy_pass http://127.0.0.1:API_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An ingest of a year of statements is not a fast request, and the
        # 60-second default turns a working import into a 504 halfway through.
        proxy_read_timeout 300s;
    }

    # Everything else is the single-page app. Caching is already handled inside
    # the UI container — hashed assets immutable, index.html no-store — so this
    # hop deliberately adds no policy of its own rather than having two places
    # that can disagree about which build a returning browser gets.
    location / {
        proxy_pass http://127.0.0.1:UI_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- TLS -------------------------------------------------------------------
#
# Deliberately not enabled by default, because it cannot be done honestly from
# a script. What is right depends on the name:
#
#   A real domain pointed at this box
#       sudo certbot --nginx -d finstone.example.com
#       Certbot rewrites the block above and adds the redirect.
#
#   A .lan / .local / .home name, which is the normal case on-prem
#       Let's Encrypt cannot issue for a name it cannot resolve. Either use
#       DNS-01 against a domain you own, or issue your own CA with `mkcert`
#       and trust it on the handful of devices that will ever open this.
#
# Until then this is plain HTTP on your own network. With no authentication in
# front of it, treat "on the LAN" as the whole of the access control — because
# it is.
